version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reunite
      POSTGRES_PASSWORD: reunite
      POSTGRES_DB: reuniteai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reunite -d reuniteai" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reunite:reunite@postgres:5432/reuniteai
      DATABASE_URL_SYNC: postgresql://reunite:reunite@postgres:5432/reuniteai
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reunite:reunite@postgres:5432/reuniteai
      DATABASE_URL_SYNC: postgresql://reunite:reunite@postgres:5432/reuniteai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://34.46.46.155:8000
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://34.46.46.155:8000
      PORT: 3000
    depends_on:
      - backend

volumes:
  pgdata:
