name: Smoke Tests

on:
  push:
    branches: [ '**' ] # Run on every push to any branch

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Backend Smoke Tests
      run: pytest tests/test_api_endpoints.py
      env:
        DATABASE_URL: sqlite+aiosqlite:///smoke.db
        SECRET_KEY: smoke_secret
        BACKEND_CORS_ORIGINS: http://localhost:3005

  frontend-smoke:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Frontend Smoke Tests
      run: npx playwright test e2e/navigation.spec.ts
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
